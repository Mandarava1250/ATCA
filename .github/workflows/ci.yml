name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: 后端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json
    
    - name: 安装依赖
      run: npm ci
    
    - name: 类型检查
      run: npm run check
    
    - name: 运行测试
      run: npm test
    
    - name: 构建项目
      run: npm run build

  frontend-test:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    
    - name: 安装依赖
      run: npm ci
    
    - name: 类型检查
      run: npm run check
    
    - name: 构建项目
      run: npm run build

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 构建后端镜像
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: atca-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 构建前端镜像
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: atca-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Docker Compose
      run: sudo apt-get update && sudo apt-get install -y docker-compose
    
    - name: 启动服务
      run: docker-compose up -d
      working-directory: .

  quality-check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: 安装依赖
      run: npm ci
    
    - name: 运行 ESLint
      run: npm run lint