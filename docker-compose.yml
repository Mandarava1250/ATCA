version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: atca-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ATCA@123.-
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - atca-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "ATCA@123.-", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atca-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.db
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - atca-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atca-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - atca-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  atca-network:
    driver: bridge
