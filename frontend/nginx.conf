worker_processes 1;
events { worker_connections 1024; }
http { 
    include mime.types;
    default_type application/octet-stream;
    sendfile on; 
    keepalive_timeout 65;
    
    client_max_body_size 500M;
    
    # 显式声明 ICO MIME 类型（解决 500 错误根源）
    types {
        image/x-icon  ico;
        image/x-icon  ico;  # 重复声明确保覆盖
    }
    
    server { 
        listen 80;
        server_name atca.xin www.atca.xin;
        root "C:/Users/Administrator/Documents/ATCA/frontend/dist";  # 使用引号包裹路径
        index index.html;
        
        client_max_body_size 500M;
        
        # 前端静态资源 - 修复 try_files 逻辑
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # 修复后的 favicon 配置（关键修改）
        location = /favicon.ico {
            # 1. 强制使用绝对路径（避免 Windows 路径解析错误）
            alias "C:/Users/Administrator/Documents/ATCA/frontend/dist/favicon.ico";
            # 2. 显式设置 Content-Type
            types {}
            default_type image/x-icon;
            # 3. 关键：禁用所有日志避免权限问题
            log_not_found off;
            access_log off;
            expires 30d;
        }
        
        location = /ATCA_Logo.ico { 
            alias "C:/Users/Administrator/Documents/ATCA/frontend/dist/ATCA_Logo.ico";
            log_not_found off;
            access_log off;
            expires 30d;
        }
        
        # API 请求代理到后端 
        location /api/ {
            client_max_body_size 500M;
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 上传文件代理 
        location /uploads/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}