# ============================================
# ATCA Nginx 生产环境配置 (全面优化版)
# 针对 2核2GiB 服务器优化
# 配置版本: v2.0
# ============================================

# ============================================
# 1. 全局配置优化
# ============================================

# 根据CPU核心数自动设置worker进程数
worker_processes auto;
# worker_cpu_affinity auto;  # Windows平台不支持此指令

# 提高文件描述符限制
worker_rlimit_nofile 65535;

# 错误日志配置（生产环境使用warn级别）
error_log logs/error.log warn;
pid logs/nginx.pid;

# ============================================
# 2. 事件模块优化
# ============================================

events {
    # 每个worker进程的最大连接数（2核服务器建议值）
    worker_connections 2048;
    
    # Windows 使用 iocp 事件模型，Linux 使用 epoll
    use iocp;
    
    # 允许同时接受多个连接
    multi_accept on;
    
    # 优化连接分配
    accept_mutex on;
}

# ============================================
# 3. HTTP 核心配置
# ============================================

http {
    # MIME类型配置
    include mime.types;
    default_type application/octet-stream;
    
    # ============================================
    # 3.1 日志配置优化
    # ============================================
    
    # 主日志格式（包含详细的请求时间信息）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    '"$request_id"';
    
    # 简化日志格式（用于静态资源）
    log_format simple '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent';
    
    # 访问日志
    access_log logs/access.log main;
    
    # 请求ID（用于追踪）
    log_format trace '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$request_id"';
    
    # ============================================
    # 3.2 性能优化配置
    # ============================================
    
    # 高效文件传输
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # 连接复用配置
    keepalive_timeout 65;
    keepalive_requests 1000;
    keepalive_disable msie6;
    
    # 请求超时配置
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    lingering_timeout 5s;
    
    # 缓冲区配置
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_buffer_size 8k;
    client_max_body_size 50m;  # 允许更大的上传文件
    
    # 隐藏Nginx版本信息（安全）
    server_tokens off;
    
    # 优化TCP参数
    # tcp_slow_start_after_idle on;  # 非标准nginx指令，已移除
    
    # ============================================
    # 3.3 Gzip压缩优化
    # ============================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;  # 平衡压缩率和CPU消耗的最佳值
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/vnd.ms-fontobject
        font/truetype
        font/opentype
        font/eot
        font/woff
        font/woff2;
    gzip_disable "msie6";
    
    # Brotli压缩（如果编译了brotli模块）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # ============================================
    # 3.4 缓存配置优化
    # ============================================
    
    # 代理缓存配置
    proxy_cache_path temp/cache/proxy 
                     levels=1:2 
                     keys_zone=api_cache:20m 
                     max_size=200m 
                     inactive=1h 
                     use_temp_path=off;
    
    # 临时文件路径
    proxy_temp_path temp/proxy_temp;
    
    # 快速CGI缓存（如使用PHP等）
    # fastcgi_cache_path temp/cache/fastcgi levels=1:2 keys_zone=fastcgi_cache:10m max_size=100m inactive=10m;
    
    # ============================================
    # 3.5 限流配置（防止DDoS攻击）
    # ============================================
    
    # 定义限流区域：每个IP每秒最多10个请求，突发20个
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # 连接数限制：每个IP最多10个并发连接
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # ============================================
    # 3.6 上游服务器配置（负载均衡）
    # ============================================
    
    upstream backend {
        # 使用最少连接算法（适合后端服务）
        least_conn;
        
        # 主服务器
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s weight=1;
        
        # 备用服务器（如有多台）
        # server 127.0.0.1:3001 max_fails=3 fail_timeout=30s weight=1 backup;
        
        # 连接复用配置
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
        
        # 健康检查（需要nginx_upstream_check_module）
        # check interval=3000 rise=2 fall=3 timeout=1000 type=http;
        # check_http_send "HEAD /health HTTP/1.0\r\n\r\n";
        # check_http_expect_alive http_2xx http_3xx;
    }
    
    # ============================================
    # 3.7 映射配置
    # ============================================
    
    # 根据User-Agent禁用缓存
    map $http_user_agent $no_cache {
        default 0;
        ~*bot|crawl|spider|slurp 1;
    }
    
    # ============================================
    # 4. 服务器块配置
    # ============================================
    
    server {
        # 监听端口
        listen 80;
        listen [::]:80;
        server_name localhost atca.xin www.atca.xin;
        
        # 字符集
        charset utf-8;
        
        # 根目录（Windows路径格式）
        root C:/ATCA/frontend/dist;
        index index.html;
        
        # ============================================
        # 4.1 安全头部配置（增强安全防护）
        # ============================================
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self';" always;
        add_header X-Permitted-Cross-Domain-Policies "master-only" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # ============================================
        # 4.2 静态资源缓存策略
        # ============================================
        
        # 带哈希的静态资源（长期缓存，1年）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log logs/static.log simple;
            try_files $uri =404;
            
            # 跨域访问支持
            add_header Access-Control-Allow-Origin *;
        }
        
        # 图片文件特殊处理
        location ~* \.(png|jpg|jpeg|gif|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
            
            # 图片优化（需要ngx_http_image_filter_module）
            # image_filter resize 1920 1080;
            # image_filter_jpeg_quality 85;
        }
        
        # HTML文件（不缓存，确保更新）
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
        }
        
        # ============================================
        # 4.3 前端路由支持（SPA）
        # ============================================
        
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # ============================================
        # 4.4 API代理配置
        # ============================================
        
        location /api/ {
            # 应用限流
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            # 代理缓存配置
            proxy_cache api_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 301 302 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_bypass $http_cache_control $no_cache;
            add_header X-Cache-Status $upstream_cache_status;
            
            # 代理基础配置
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 缓冲区配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 只缓存GET和HEAD请求
            proxy_cache_methods GET HEAD;
            
            # 错误处理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_timeout 0;
            proxy_next_upstream_tries 2;
        }
        
        # ============================================
        # 4.5 健康检查端点
        # ============================================
        
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            access_log off;
            
            # 健康检查特殊响应头
            add_header X-Health-Check "pass" always;
        }
        
        # ============================================
        # 4.6 上传文件代理
        # ============================================
        
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 上传文件缓存（1天）
            expires 1d;
            add_header Cache-Control "public";
            
            # 头像文件短缓存（5分钟）
            location ~* /uploads/avatars/ {
                expires 5m;
                add_header Cache-Control "public, must-revalidate";
            }
            
            # 大文件上传超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            client_max_body_size 50m;
        }
        
        # ============================================
        # 4.7 API文档
        # ============================================
        
        location /api-docs {
            proxy_pass http://backend/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            # 不缓存API文档
            expires -1;
            add_header Cache-Control "no-cache";
        }
        
        # ============================================
        # 4.8 WebSocket支持（如果需要）
        # ============================================
        
        location /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ============================================
        # 4.9 安全限制
        # ============================================
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 禁止访问敏感目录
        location ~* /(node_modules|\.git|backup|test)/ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 禁止访问配置文件
        location ~* \.(conf|log|sql|bak|old)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # ============================================
        # 4.10 错误处理
        # ============================================
        
        # 自定义错误页面
        error_page 400 /error/400.html;
        error_page 401 /error/401.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 500 502 503 504 /error/5xx.html;
        
        # 错误页面代理
        location /error/ {
            root C:/ATCA/frontend/dist;
            internal;
        }
        
        # ============================================
        # 4.11 重定向规则
        # ============================================
        
        # 规范化URL（移除尾部斜杠）
        rewrite ^/(.*)/$ /$1 permanent;
        
        # 移除index.html
        rewrite ^/index\.html$ / permanent;
    }
    
    # ============================================
    # 5. HTTPS配置（生产环境建议启用）
    # ============================================
    
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name atca.xin www.atca.xin;
    #     
    #     # SSL证书配置
    #     ssl_certificate     certs/atca.xin.crt;
    #     ssl_certificate_key certs/atca.xin.key;
    #     ssl_trusted_certificate certs/ca-bundle.crt;
    #     
    #     # SSL优化配置
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_session_tickets off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 8.8.8.8 8.8.4.4 valid=300s;
    #     resolver_timeout 5s;
    #     
    #     # HSTS配置
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     
    #     # 其他配置同HTTP服务器块...
    # }
    # 
    # # HTTP重定向到HTTPS
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name atca.xin www.atca.xin;
    #     return 301 https://$host$request_uri;
    # }
}

# ============================================
# 配置优化说明
# ============================================
#
# 1. 性能优化：
#    - worker_processes auto: 根据CPU核心自动调整
#    - worker_connections 2048: 提高并发连接能力
#    - sendfile/tcp_nopush/tcp_nodelay: 优化TCP传输
#    - gzip_comp_level 6: 平衡压缩率和CPU消耗
#
# 2. 安全加固：
#    - server_tokens off: 隐藏版本信息
#    - 安全响应头: X-Frame-Options, X-XSS-Protection等
#    - Content-Security-Policy: 防止XSS和数据注入
#    - 禁止访问敏感文件和目录
#
# 3. 缓存策略：
#    - 静态资源1年缓存（带哈希）
#    - HTML不缓存
#    - API响应缓存10分钟
#    - 上传文件1天缓存
#
# 4. 限流保护：
#    - 每秒10个请求限制
#    - 每个IP最多10个并发连接
#
# 5. 错误处理：
#    - 自定义错误页面
#    - 后端故障时使用缓存响应
#
# 6. HTTPS支持（注释掉，需要时启用）：
#    - TLS 1.2/1.3
#    - HTTP/2支持
#    - HSTS配置
#
# ============================================