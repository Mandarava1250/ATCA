# ============================================
# 华夏营造 - Nginx 反向代理配置
# 针对 2核 2G 服务器优化
# ============================================

user nginx;
worker_processes auto;  # 自动检测CPU核心数，2核服务器会使用2个worker进程
worker_rlimit_nofile 65535;  # 提高文件描述符限制

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 2核2G服务器的优化配置
    worker_connections 2048;  # 每个worker进程的最大连接数
    use epoll;  # 使用epoll事件模型（Linux高效I/O模型）
    multi_accept on;  # 允许同时接受多个连接
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ============================================
    # 性能优化配置
    # ============================================

    # 隐藏Nginx版本号（安全）
    server_tokens off;

    # 高效文件传输
    sendfile on;
    tcp_nopush on;  # 减少网络包数量
    tcp_nodelay on;  # 禁用Nagle算法，减少延迟

    # 连接超时设置（针对低资源服务器）
    keepalive_timeout 30;  # 保持连接30秒
    client_header_timeout 10;
    client_body_timeout 10;
    send_timeout 10;

    # 缓冲区设置
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_max_body_size 10m;  # 限制上传文件大小

    # Gzip压缩配置（显著减少传输数据量）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;  # 压缩级别1-9，6是平衡压缩率和CPU消耗的最佳值
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";  # 禁用IE6的gzip
    gzip_min_length 1000;  # 仅压缩大于1KB的文件

    # ============================================
    # 缓存配置
    # ============================================

    # 静态资源缓存路径
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;

    # 临时文件路径
    proxy_temp_path /var/cache/nginx/tmp;

    # ============================================
    # 限流配置（防止服务器过载）
    # ============================================

    # 定义限流区域：每个IP每秒最多10个请求，突发20个
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ============================================
    # 上游服务器配置
    # ============================================

    # 后端API服务器
    upstream backend {
        # 使用keepalive连接池，减少TCP握手开销
        least_conn;  # 使用最少连接算法
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;  # 保持32个空闲连接
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # ============================================
    # 主服务器配置
    # ============================================

    server {
        listen 80;
        listen [::]:80;
        server_name atca.xin;  # 替换为你的域名

        # 字符集
        charset utf-8;

        # 根目录（前端静态文件）
        root /var/www/atca/frontend/dist;
        index index.html;

        # ============================================
        # 安全头设置
        # ============================================

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ============================================
        # 静态资源缓存策略
        # ============================================

        # 带哈希的静态资源（长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;  # 关闭日志记录
            try_files $uri =404;
        }

        # HTML文件（不缓存，确保更新）
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # ============================================
        # API反向代理配置
        # ============================================

        location /api/ {
            # 应用限流
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            # 代理配置
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 缓冲区设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # 启用代理缓存（对GET请求）
            proxy_cache static_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # 缓存键
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # 添加缓存状态头
            add_header X-Cache-Status $upstream_cache_status;

            # 跳过缓存的条件
            proxy_no_cache $http_pragma $http_authorization;
        }

        # ============================================
        # SPA路由支持
        # ============================================

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ============================================
        # 健康检查端点
        # ============================================

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ============================================
        # 禁止访问隐藏文件
        # ============================================

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ============================================
    # HTTPS配置（可选，推荐生产环境使用）
    # ============================================

    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name atca.xin;
    #
    #     # SSL证书配置
    #     ssl_certificate /etc/letsencrypt/live/atca.xin/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/atca.xin/privkey.pem;
    #
    #     # SSL优化配置
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_session_tickets off;
    #
    #     # OCSP Stapling
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     ssl_trusted_certificate /etc/letsencrypt/live/atca.xin/chain.pem;
    #     resolver 8.8.8.8 8.8.4.4 valid=300s;
    #     resolver_timeout 5s;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # 其他配置与HTTP相同
    #     root /var/www/atca/frontend/dist;
    #     index index.html;
    #
    #     # ... 其他location配置 ...
    # }
    #
    # # HTTP到HTTPS重定向
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name atca.xin;
    #     return 301 https://$server_name$request_uri;
    # }
}

# ============================================
# 配置说明
# ============================================
#
# 1. Worker进程配置：
#    - worker_processes auto：自动使用2个worker进程（对应2核CPU）
#    - worker_connections 2048：每个进程最多2048个连接，总计4096个并发连接
#
# 2. 性能优化：
#    - sendfile on：使用内核级别的文件传输，减少CPU开销
#    - tcp_nopush on：批量发送数据包，减少网络开销
#    - gzip压缩：减少60-80%的传输数据量
#
# 3. 缓存策略：
#    - 静态资源：1年缓存（带哈希的文件名确保更新）
#    - HTML文件：不缓存，确保获取最新版本
#    - API响应：10分钟缓存，减少后端压力
#
# 4. 连接优化：
#    - keepalive：保持连接复用，减少TCP握手
#    - upstream keepalive：与后端保持32个持久连接
#
# 5. 限流保护：
#    - 每个IP每秒最多10个请求
#    - 防止服务器过载和DDoS攻击
#
# 6. 内存优化：
#    - 限制缓冲区大小，避免内存溢出
#    - 合理设置缓存大小（100MB）
#
# ============================================